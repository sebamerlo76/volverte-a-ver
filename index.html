<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3852" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chicho" />
    <title>Chicho — Mascotas perdidas y encontradas en tu zona</title>
    <meta name="description" content="Publicá y encontrá mascotas perdidas y encontradas cerca tuyo. Recibí avisos de tu zona. Gratis." />

    <!-- Open Graph (WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chicho" />
    <meta property="og:title" content="Chicho — Mascotas perdidas y encontradas en tu zona" />
    <meta property="og:description" content="Publicá y encontrá mascotas perdidas y encontradas cerca tuyo. Recibí avisos de tu zona. Gratis." />
    <meta property="og:url" content="https://chicho.ar/" />
    <meta property="og:image" content="https://chicho.ar/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chicho — Mascotas perdidas y encontradas en tu zona" />
    <meta name="twitter:description" content="Publicá y encontrá mascotas perdidas y encontradas cerca tuyo. Recibí avisos de tu zona. Gratis." />
    <meta name="twitter:image" content="https://chicho.ar/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Supabase (datos + fotos): dejar la conexión tibia para que el feed y las fotos
         arranquen antes → mejor LCP, sobre todo en mobile. El dominio es público (ya va
         en el bundle). El demo usa otra Supabase: este hint es inocuo ahí.
         VAN LOS DOS, y no sobra ninguno: el navegador guarda las conexiones CORS y las
         comunes por separado. Con crossorigin sirve al fetch del feed; sin crossorigin,
         a las fotos (<img> no pide CORS). Teniendo solo el primero, PageSpeed marcaba
         "conexión previa sin usar" y a la vez pedía preconectar a Supabase: las fotos
         abrían una conexión nueva de cero, ~330 ms estimados de LCP. -->
    <link rel="preconnect" href="https://ltrutscputgtmrxpmjbm.supabase.co" crossorigin />
    <link rel="preconnect" href="https://ltrutscputgtmrxpmjbm.supabase.co" />
    <!-- Fuentes NO bloqueantes (se precargan y se aplican al terminar, sin frenar
         el primer pintado). Texto: display=swap (aparece ya con la fuente de
         respaldo). Íconos: display=block (quedan en blanco un instante mientras
         cargan, en vez de mostrar el nombre del ícono como texto). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap"
      />
    </noscript>
    <!-- Pantalla de arranque: lo primero que se ve, sin esperar NADA (ni la hoja de
         estilos ni el JS). Antes el HTML llegaba con un div vacío y la pantalla
         quedaba en blanco hasta que React montaba: PageSpeed en un Moto G medía 7,4 s
         de First Contentful Paint. Va con estilos inline a propósito, y React la
         reemplaza sola al montar (createRoot vacía el contenedor). -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #faf7f1;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center;
        padding: 20px;
      }
      #boot img {
        width: 88px;
        height: 88px;
      }
      #boot .t {
        font-size: 27px;
        font-weight: 800;
        color: #1f3852;
      }
      #boot .s {
        font-size: 14px;
        font-weight: 600;
        color: #8a807a;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <img src="/logo-boot.png" alt="" width="88" height="88" fetchpriority="high" />
        <div class="t">Chicho</div>
        <div class="s">Mascotas perdidas y encontradas 🐾</div>
      </div>
    </div>
    <!-- Pedimos el feed ACÁ, apenas se lee el HTML, en paralelo con la descarga del
         JS. Si esperamos a que React monte, en un celu lento se pierden 2-3 s antes
         de siquiera saber qué fotos hay que bajar — y la primera foto es el LCP.
         store.js consume esta promesa (window.__feedPre) en getReportes().
         Las columnas están duplicadas de COLS_FEED: si tocás una, tocá las dos
         (test/cols-feed.test.mjs falla si se desincronizan). -->
    <script>
      ;(function () {
        var u = '%VITE_SUPABASE_URL%'
        var k = '%VITE_SUPABASE_ANON_KEY%'
        // Sin variables de entorno (el demo) Vite deja el literal con %: no precargamos.
        if (u.indexOf('%') !== -1 || k.indexOf('%') !== -1) return
        var cols =
          'id,tipo,especie,nombre,zona,referencia,color,tamano,raza,descripcion,foto,fotos,whatsapp,autor,fecha_evento,creado_en,estado,user_id,mascota_id,sexo,edad,collar,recompensa,lat,lng,en_custodia,localidad,apoyos,aplausos,resuelto_en,recordatorio_en'
        var url =
          u +
          '/rest/v1/reportes?select=' +
          cols +
          '&estado=eq.activo&oculto=eq.false&bloqueado=eq.false&order=creado_en.desc'
        window.__feedPre = fetch(url, { headers: { apikey: k, Authorization: 'Bearer ' + k } })
          .then(function (r) {
            return r.ok ? r.json() : null
          })
          .catch(function () {
            return null // sin conexión o error: el store lo pide de nuevo por el camino normal
          })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
